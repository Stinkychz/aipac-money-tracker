# Once a week: open every FEC source link the page shows. If any is broken the run fails, and
# GitHub emails the repository owner; the broken links are listed in the run's log.
name: Check source links
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python check_links.py
