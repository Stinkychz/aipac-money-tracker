# Every hour: rebuild the page's built-in FEC data from the FEC bulk files and commit it if it
# changed. GitHub Pages then republishes the site. Free for public repositories.
name: Refresh FEC data
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
concurrency:
  group: refresh
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - run: |
          git config user.name "fec-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Refresh FEC data" && git push)
